name: iPhone build check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync
      - run: xcodebuild -version
      - name: Build for the iPhone simulator (no signing needed)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check the built app contains the sound, privacy manifest and name
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name App.app -path "*Debug-iphonesimulator*" | head -1)
          echo "App bundle: $APP"
          ls "$APP"
          test -f "$APP/adhan_short.mp3"
          test -f "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$APP/Info.plist"
